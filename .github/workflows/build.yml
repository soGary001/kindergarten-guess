name: build-installers

# Builds the desktop (.dmg / .exe) and Android (.apk) installers in the cloud.
# The Bailian API key is injected from the repo secret BAILIAN_API_KEY at compile
# time (build.rs reads it), so it is never committed to the repo.
#
# Run it: Actions tab -> "build-installers" -> "Run workflow", or push a tag like v0.1.0.
# Download the installers from the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    name: desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # universal .dmg (Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
          - platform: windows-latest  # .exe (NSIS) + .msi
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install frontend deps
        run: npm ci
      - name: Build app (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
        with:
          args: ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  android:
    name: android (.apk)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install NDK + platform
        run: sdkmanager "ndk;${NDK_VERSION}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install frontend deps
        run: npm ci
      - name: Init Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android init --ci
      - name: Add microphone + internet permissions
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's#(<application)#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    $1#' "$MANIFEST"
          echo "----- manifest -----" && cat "$MANIFEST"
      - name: Build APK (debug, unsigned but installable)
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android build --apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: warn
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
